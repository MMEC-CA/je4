<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphic Calculator</title>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent: #00d2ff;
            --text: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #0f0c29, #302b63, #24243e);
            overflow: hidden;
        }

        #root {
            z-index: 1;
        }

        .calculator {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            width: 320px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
        }

        .display {
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.2);
            border: none;
            border-radius: 10px;
            margin-bottom: 20px;
            padding: 15px;
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            color: var(--text);
            overflow: hidden;
        }

        .history {
            font-size: 0.9rem;
            opacity: 0.6;
            height: 20px;
        }

        .current {
            font-size: 2rem;
            font-weight: 300;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 60px;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            background: var(--glass-bg);
            color: var(--text);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.operator {
            background: rgba(0, 210, 255, 0.1);
            color: var(--accent);
            font-weight: bold;
        }

        button.equals {
            grid-column: span 2;
            background: var(--accent);
            color: #000;
            border: none;
            font-weight: bold;
        }

        button.clear {
            grid-column: span 2;
            color: #ff4b2b;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function Calculator() {
            const [display, setDisplay] = useState('0');
            const [history, setHistory] = useState('');
            const [shouldReset, setShouldReset] = useState(false);

            const handleNumber = (num) => {
                if (display === '0' || shouldReset) {
                    setDisplay(num);
                    setShouldReset(false);
                } else {
                    setDisplay(display + num);
                }
            };

            const handleOperator = (op) => {
                setHistory(display + ' ' + op);
                setShouldReset(true);
            };

            const calculate = () => {
                if (!history || shouldReset) return;
                
                try {
                    const expression = history + ' ' + display;
                    // Note: In a production app, use a safer math parser
                    const result = eval(expression.replace('×', '*').replace('÷', '/'));
                    setDisplay(String(Number(result.toFixed(8))));
                    setHistory('');
                    setShouldReset(true);
                } catch (e) {
                    setDisplay('Error');
                    setHistory('');
                    setShouldReset(true);
                }
            };

            const clear = () => {
                setDisplay('0');
                setHistory('');
            };

            return (
                <div className="calculator">
                    <div className="display">
                        <div className="history">{history}</div>
                        <div className="current">{display}</div>
                    </div>
                    <div className="buttons">
                        <button className="clear" onClick={clear}>C</button>
                        <button className="operator" onClick={() => handleOperator('÷')}>÷</button>
                        <button className="operator" onClick={() => handleOperator('×')}>×</button>
                        
                        <button onClick={() => handleNumber('7')}>7</button>
                        <button onClick={() => handleNumber('8')}>8</button>
                        <button onClick={() => handleNumber('9')}>9</button>
                        <button className="operator" onClick={() => handleOperator('-')}>-</button>
                        
                        <button onClick={() => handleNumber('4')}>4</button>
                        <button onClick={() => handleNumber('5')}>5</button>
                        <button onClick={() => handleNumber('6')}>6</button>
                        <button className="operator" onClick={() => handleOperator('+')}>+</button>
                        
                        <button onClick={() => handleNumber('1')}>1</button>
                        <button onClick={() => handleNumber('2')}>2</button>
                        <button onClick={() => handleNumber('3')}>3</button>
                        <button onClick={() => handleNumber('0')}>0</button>
                        
                        <button onClick={() => handleNumber('.')}>.</button>
                        <button className="equals" onClick={calculate}>=</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Calculator />);
    </script>
</body>
</html>
